name: SCCE Stage-C2 validation

concurrency:
  group: \${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "prototype/scc_endogenous_household_*.py"
      - "prototype/scc_household_signals.py"
      - "prototype/care_service_queue.py"
      - "prototype/test_care_service_queue.py"
      - "prototype/test_scc_endogenous_household_*.py"
      - "prototype/test_scc_household_signals.py"
      - ".github/workflows/scc-c2-validation.yml"
  pull_request:
    paths:
      - "prototype/scc_endogenous_household_*.py"
      - "prototype/scc_household_signals.py"
      - "prototype/care_service_queue.py"
      - "prototype/test_care_service_queue.py"
      - "prototype/test_scc_endogenous_household_*.py"
      - "prototype/test_scc_household_signals.py"
      - ".github/workflows/scc-c2-validation.yml"
  workflow_dispatch:

jobs:
  validate-c2-household-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run C2 household signal and feedback tests
        run: |
          python -m unittest discover -s prototype -p 'test_*.py' -v
      - name: Run paired C2-A2 household feedback experiment (20 seeds)
        run: |
          python prototype/scc_endogenous_household_experiment.py --runs 20 --shock compound --periods 24 --hops 2 --households-per-cell 10 --priority-dispersion 0.4 --backlog-retention 1.0 --max-backlog-periods 1.0 --max-care-queue-age-periods 3 --summary-only
      - name: Run C2-A2 zero-backlog control (20 seeds)
        run: |
          python prototype/scc_endogenous_household_experiment.py --runs 20 --shock compound --periods 24 --hops 2 --households-per-cell 10 --priority-dispersion 0.4 --backlog-retention 0 --max-backlog-periods 0 --max-care-queue-age-periods 3 --household-policies proportional --summary-only
      - name: Run paired C2-A2 backlog sensitivity against zero-backlog control (20 seeds)
        run: |
          python prototype/scc_endogenous_household_experiment.py --backlog-sensitivity --runs 20 --shock compound --periods 24 --hops 2 --households-per-cell 10 --priority-dispersion 0.4 --backlog-retention 0.5 --max-backlog-periods 1.0 --summary-only
      - name: Run paired C2-A2 current-first versus backlog-first sensitivity (20 seeds)
        run: |
          python prototype/scc_endogenous_household_experiment.py --service-order-sensitivity --runs 20 --shock compound --periods 24 --hops 2 --households-per-cell 10 --priority-dispersion 0.4 --backlog-retention 0.5 --max-backlog-periods 1.0 --summary-only
