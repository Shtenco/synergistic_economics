name: Cross-repository Economics-Metaverse-Maps settlement contract

on:
  pull_request:
    branches:
      - research/bank-deposit-credit-audit-fix-20261115
  push:
    branches:
      - feature/canonical-economic-entity-register-v1-rebased-20261115b

permissions:
  contents: read

jobs:
  cross-repository-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Economics
        uses: actions/checkout@v4
        with:
          path: economics
      - name: Checkout Metaverse PR integration merge commit
        uses: actions/checkout@v4
        with:
          repository: Shtenco/synergy_metaverse
          ref: ca0760bbecc56e1fd01c583afef500cb5af04160
          path: external/synergy_metaverse
      - name: Checkout Maps trust verifier and API
        uses: actions/checkout@v4
        with:
          repository: Shtenco/synergy_maps
          ref: 03c94d8ca35fb318896fe587da7da7ee5d7c1191
          path: external/synergy_maps
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cross-repository test dependencies
        run: python -m pip install --upgrade pytest cryptography rfc8785 fastapi httpx h3
      - name: Run end-to-end contract flow
        working-directory: economics
        env:
          ECONOMICS_SOURCE: ${{ github.workspace }}/economics
          MAPS_SOURCE: ${{ github.workspace }}/external/synergy_maps
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/integration/test_cross_repo_economic_spatial_payment_flow.py
