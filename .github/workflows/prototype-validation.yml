name: Prototype validation

on:
  push:
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-validation.yml"
  pull_request:
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-validation.yml"

jobs:
  test-economic-prototypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run prototype unit tests
        run: python -m unittest discover -s prototype -p 'test_*.py' -v
      - name: Run baseline seven-cell simulation
        run: python prototype/seven_cell_economy.py --scenario baseline --periods 24
      - name: Run compound crisis simulation
        run: python prototype/seven_cell_economy.py --scenario compound_crisis --periods 24
      - name: Run baseline input-output simulation
        run: python prototype/io_economy.py --scenario baseline --periods 12
      - name: Run compound input-output simulation
        run: python prototype/io_economy.py --scenario compound_shock --periods 12
      - name: Run paired SCCE cellular comparison (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock none --hops 1 --summary-only
      - name: Run paired SCCE cellular comparison with two-hop local reach (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock none --hops 2 --summary-only
      - name: Run paired SCCE cellular stress comparison (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock compound --hops 2 --summary-only
      - name: Run paired SCCE local-only stress comparison (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock compound --hops 1 --summary-only
      - name: Run paired SCCE supply-crisis comparison (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock supply_crisis --hops 2 --summary-only
      - name: Run paired SCCE demand-surge comparison (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock demand_surge --hops 2 --summary-only
      - name: Run Stage-B SCCE dynamic physical economy
        run: python prototype/scc_dynamic_economy.py --compare --shock none --periods 24 --hops 2
      - name: Run Stage-B SCCE compound crisis comparison
        run: python prototype/scc_dynamic_economy.py --compare --shock compound --periods 24 --hops 2
      - name: Run Stage-B paired dynamic Monte Carlo (100 seeds, baseline)
        run: python prototype/scc_dynamic_economy.py --monte-carlo 100 --shock none --periods 24 --hops 2 --summary-only
      - name: Run Stage-B paired dynamic Monte Carlo (100 seeds, compound shock, two-hop local reach)
        run: python prototype/scc_dynamic_economy.py --monte-carlo 100 --shock compound --periods 24 --hops 2 --summary-only
      - name: Run Stage-B paired dynamic Monte Carlo (100 seeds, compound shock, three-hop local reach)
        run: python prototype/scc_dynamic_economy.py --monte-carlo 100 --shock compound --periods 24 --hops 3 --summary-only
      - name: Run Stage-B paired dynamic Monte Carlo (100 seeds, compound shock, one-hop local reach)
        run: python prototype/scc_dynamic_economy.py --monte-carlo 100 --shock compound --periods 24 --hops 1 --summary-only
      - name: Run Stage-B coordination-labour reference (20 seeds, default message cost)
        run: python prototype/scc_dynamic_economy.py --monte-carlo 20 --shock compound --periods 24 --hops 2 --coordination-hours-per-message 0.01 --summary-only
      - name: Run Stage-B coordination-labour sensitivity (20 seeds, elevated message cost)
        run: python prototype/scc_dynamic_economy.py --monte-carlo 20 --shock compound --periods 24 --hops 2 --coordination-hours-per-message 0.05 --summary-only
