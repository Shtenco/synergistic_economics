name: Prototype validation

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "prototype/**"
      - "research/audits/sfc_scce_a2_4_2026-11-11/**"
      - ".github/workflows/prototype-validation.yml"
  pull_request:
    paths:
      - "prototype/**"
      - "research/audits/sfc_scce_a2_4_2026-11-11/**"
      - ".github/workflows/prototype-validation.yml"


jobs:
  test-economic-prototypes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ed25519 checkpoint dependency
        run: python -m pip install "cryptography>=44,<47" pytest
      - name: Run prototype unit tests
        run: python -m unittest discover -s prototype -p 'test_*.py' -v
      - name: Run baseline seven-cell simulation
        run: python prototype/seven_cell_economy.py --scenario baseline --periods 24
      - name: Run compound crisis simulation
        run: python prototype/seven_cell_economy.py --scenario compound_crisis --periods 24
      - name: Run baseline input-output simulation
        run: python prototype/io_economy.py --scenario baseline --periods 12
      - name: Run compound input-output simulation
        run: python prototype/io_economy.py --scenario compound_shock --periods 12
      - name: Run equal-volume bank-credit allocation experiment
        run: python prototype/bank_credit_real_economy_experiment.py --credit-amount 50000 --periods 12 --output /tmp/bank-credit-real-economy.json
      - name: Run fixed-asset capex lifecycle audit
        run: python -m unittest discover -s prototype -p 'test_firm_fixed_assets.py' -v
      - name: Run B8.1 capital cohort lifecycle and SCCE bridge audit
        run: python research/audits/sfc_scce_a2_4_2026-11-11/audit_scce_capital_cohort_bridge.py
      - name: Run durable B8.1 capital cohort store audit
        run: python research/audits/sfc_scce_a2_4_2026-11-11/audit_capital_cohort_store.py
      - name: Run paired SCCE cellular comparison (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock none --hops 1 --summary-only
      - name: Run paired SCCE cellular comparison with two-hop local reach (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock none --hops 2 --summary-only
      - name: Run paired SCCE cellular stress comparison (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock compound --hops 2 --summary-only
      - name: Run paired SCCE local-only stress comparison (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock compound --hops 1 --summary-only
      - name: Run paired SCCE supply-crisis comparison (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock supply_crisis --hops 2 --summary-only
      - name: Run paired SCCE demand-surge comparison (100 seeds)
        run: python prototype/cellular_coordination.py --monte-carlo 100 --shock demand_surge --hops 2 --summary-only
      - name: Run Stage-B SCCE dynamic physical economy
        run: python prototype/scc_dynamic_economy.py --compare --shock none --periods 24 --hops 2
      - name: Run Stage-B SCCE compound crisis comparison
        run: python prototype/scc_dynamic_economy.py --compare --shock compound --periods 24 --hops 2
      - name: Run Stage-B paired dynamic Monte Carlo (100 seeds, baseline)
        run: python prototype/scc_dynamic_economy.py --monte-carlo 100 --shock none --periods 24 --hops 2 --summary-only
      - name: Run Stage-B paired dynamic Monte Carlo (100 seeds, compound shock, two-hop local reach)
        run: python prototype/scc_dynamic_economy.py --monte-carlo 100 --shock compound --periods 24 --hops 2 --summary-only
      - name: Run Stage-B paired dynamic Monte Carlo (100 seeds, compound shock, three-hop local reach)
        run: python prototype/scc_dynamic_economy.py --monte-carlo 100 --shock compound --periods 24 --hops 3 --summary-only
      - name: Run Stage-B paired dynamic Monte Carlo (100 seeds, compound shock, one-hop local reach)
        run: python prototype/scc_dynamic_economy.py --monte-carlo 100 --shock compound --periods 24 --hops 1 --summary-only
      - name: Run paired Stage-B coordination-labour sensitivity (20 seeds)
        run: python prototype/scc_dynamic_economy.py --coordination-sensitivity --monte-carlo 20 --shock compound --periods 24 --hops 2
      - name: Run paired Stage-B coordination-labour response frontier (20 seeds, six levels)
        run: python prototype/scc_dynamic_economy.py --coordination-frontier --monte-carlo 20 --shock compound --periods 24 --hops 2 --summary-only
      - name: Prepare Stage-C paired evidence directory
        run: mkdir -p /tmp/scc-stage-c-results
      - name: Run Stage-C1 household distribution experiment (20 paired seeds)
        run: python prototype/scc_household_experiment.py --runs 20 --shock compound --periods 24 --hops 2 --households-per-cell 10 --priority-dispersion 0.4 --essential-floor-fraction 0.5 --summary-only --output /tmp/scc-stage-c-results/stage-c1-floor-50.json
      - name: Run Stage-C1 household floor sensitivity (25 percent floor, 20 paired seeds)
        run: python prototype/scc_household_experiment.py --runs 20 --shock compound --periods 24 --hops 2 --households-per-cell 10 --priority-dispersion 0.4 --essential-floor-fraction 0.25 --summary-only --output /tmp/scc-stage-c-results/stage-c1-floor-25.json
      - name: Run Stage-C1 household floor sensitivity (75 percent floor, 20 paired seeds)
        run: python prototype/scc_household_experiment.py --runs 20 --shock compound --periods 24 --hops 2 --households-per-cell 10 --priority-dispersion 0.4 --essential-floor-fraction 0.75 --summary-only --output /tmp/scc-stage-c-results/stage-c1-floor-75.json
      - name: Run Stage-C2-A2 endogenous household feedback experiment (20 paired seeds)
        run: python prototype/scc_endogenous_household_experiment.py --runs 20 --shock compound --periods 24 --hops 2 --households-per-cell 10 --priority-dispersion 0.4 --backlog-retention 0.5 --max-backlog-periods 1.0 --summary-only --output /tmp/scc-stage-c-results/stage-c2-a2-endogenous-households.json
      - name: Upload Stage-C paired experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: synergy-stage-c-experiment-evidence
          path: /tmp/scc-stage-c-results/*.json
          if-no-files-found: error
          retention-days: 90


  cross-repository-contract:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: synergy_maps
          POSTGRES_USER: synergy
          POSTGRES_PASSWORD: synergy-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synergy -d synergy_maps"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://synergy:synergy-test-password@localhost:5432/synergy_maps
    steps:
      - name: Checkout Economics
        uses: actions/checkout@v4
        with:
          path: economics
      - name: Require cross-repository read token
        env:
          CROSS_REPO_TOKEN: ${{ secrets.SYNERGY_CROSS_REPO_READ_TOKEN }}
        run: test -n "$CROSS_REPO_TOKEN" || { echo "::error::Add SYNERGY_CROSS_REPO_READ_TOKEN with read access to Economics, Metaverse, Maps and Agentic AI"; exit 1; }
      - name: Checkout Metaverse PR integration snapshot
        id: checkout_metaverse
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNERGY_CROSS_REPO_READ_TOKEN }}
          repository: Shtenco/synergy_metaverse
          ref: 6513df6c6738f0531dbb9105a148bed37dbfe589
          path: external/synergy_metaverse
      - name: Checkout Maps PR integration snapshot
        id: checkout_maps
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNERGY_CROSS_REPO_READ_TOKEN }}
          repository: Shtenco/synergy_maps
          ref: bb64124c67e5a76ac4669e28bab13090f1238282
          path: external/synergy_maps
      - name: Checkout Maps global Cesium and EAEU coverage snapshot
        id: checkout_maps_global
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNERGY_CROSS_REPO_READ_TOKEN }}
          repository: Shtenco/synergy_maps
          ref: 19724d71b3abb4389403ba00d3472d6016dbfe4d
          path: external/synergy_maps-global
      - name: Checkout HardNAV accounting PR snapshot
        id: checkout_hardnav
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNERGY_CROSS_REPO_READ_TOKEN }}
          repository: Shtenco/synergy_agentic_ai_economy
          ref: 0effe839d160af295d511eaea6a3d3830e024557
          path: external/synergy_agentic_ai_economy
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cross-repository test dependencies
        run: python -m pip install --upgrade pytest cryptography rfc8785 fastapi httpx h3 jsonschema==4.23.0 'psycopg[binary]==3.2.4' 'uvicorn[standard]==0.34.0'
      - name: Run pinned cross-repository end-to-end contract flow
        env:
          ECONOMICS_SOURCE: ${{ github.workspace }}/economics
          MAPS_SOURCE: ${{ github.workspace }}/external/synergy_maps
          AGENTIC_SOURCE: ${{ github.workspace }}/external/synergy_agentic_ai_economy
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src:${{ github.workspace }}/external/synergy_agentic_ai_economy
          SYNERGY_AUDIT_OUTPUT: ${{ github.workspace }}/synergy-audit-proof.json
        run: python -m pytest -q external/synergy_metaverse/tests/integration/test_cross_repo_economic_spatial_payment_flow.py
      - name: Upload signed cross-repository audit proof
        uses: actions/upload-artifact@v4
        with:
          name: synergy-cross-repo-audit-proof
          path: synergy-audit-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Compile Metaverse modules and tests
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        run: python -m compileall -q external/synergy_metaverse/src external/synergy_metaverse/tests
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
      - name: Test Metaverse Business Twin
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_business_twin.py
      - name: Test Metaverse Contract schemas
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_contract_schemas.py
      - name: Test Metaverse Cryptographic contracts
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_crypto.py
      - name: Test Metaverse Economic binding
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_economic_binding.py
      - name: Test Metaverse Economic projection store
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_economic_projection_store.py
      - name: Test Metaverse Envelope protector
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_envelope_protector.py
      - name: Test Metaverse League projection
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_league_projection.py
      - name: Test Metaverse League projection store
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_league_projection_store.py
      - name: Test Metaverse NMEA ingestion
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_nmea.py
      - name: Test Metaverse Observation store
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_observation_store.py
      - name: Test Metaverse OSM registry import
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_osm_registry_import.py
      - name: Test Metaverse Spatial registry
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_registry.py
      - name: Test Metaverse Spatial registry proofs
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_registry_proof.py
      - name: Test Metaverse RF/GNSS contracts
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_rf_gnss.py
      - name: Test Metaverse Trust revocation
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_trust_revocation.py
      - name: Test Metaverse Trusted key registry
        if: ${{ always() && !cancelled() && steps.checkout_metaverse.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_metaverse/src
        run: python -m pytest -q external/synergy_metaverse/tests/test_trusted_key_registry.py
      - name: Run Maps trust and spatial proof regressions
        if: ${{ always() && !cancelled() && steps.checkout_maps.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_maps/src
        run: |
          python -m compileall -q external/synergy_maps/src external/synergy_maps/tests
          python -m pytest -q external/synergy_maps/tests
      - name: Build Maps Cesium frontend
        if: ${{ always() && !cancelled() && steps.checkout_maps.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Maps frontend dependencies
        if: ${{ always() && !cancelled() && steps.checkout_maps.outcome == 'success' }}
        working-directory: external/synergy_maps/web
        run: npm install --ignore-scripts
      - name: Report Maps frontend dependency audit
        if: ${{ always() && !cancelled() && steps.checkout_maps.outcome == 'success' }}
        working-directory: external/synergy_maps/web
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const r=require("./npm-audit.json"); console.log("npm audit counts:", JSON.stringify(r.metadata?.vulnerabilities ?? r.error)); for (const [n,v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({name:n,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:x.title)}));'
      - name: Build Maps Cesium frontend
        if: always()
        working-directory: external/synergy_maps/web
        run: npm run build
      - name: Test global Maps ingestion and EAEU country coverage
        if: ${{ always() && !cancelled() && steps.checkout_maps_global.outcome == 'success' }}
        working-directory: external/synergy_maps-global
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m py_compile scripts/*.py tests/*.py
      - name: Build and test global SYNERGY Maps viewer
        if: ${{ always() && !cancelled() && steps.checkout_maps_global.outcome == 'success' }}
        working-directory: external/synergy_maps-global
        run: |
          npm install --ignore-scripts
          npm test
          npm run build
          node scripts/plan_eaeu_country_tiles.mjs /tmp/synergy-eaeu-plans
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from run_overture_tile_jobs import load_plan
          root = Path("/tmp/synergy-eaeu-plans")
          expected = {"am", "by", "kz", "kg", "ru"}
          actual = {path.stem for path in root.glob("*.json") if path.name != "summary.json"}
          assert actual == expected, (actual, expected)
          for country in sorted(expected):
              plan = load_plan(root / f"{country}.json", 20000)
              assert plan["country"]["alpha2"].lower() == country
              assert plan["tile_count"] == len(plan["jobs"]) > 0
          summary = json.loads((root / "summary.json").read_text())
          assert summary["total_jobs"] == sum(x["jobs"] for x in summary["countries"])
          print(f"EAEU COUNTRY PLANS: PASS ({summary['total_jobs']} bounded tile jobs)")
          PY
      - name: Run HardNAV accounting regressions
        if: ${{ always() && !cancelled() && steps.checkout_hardnav.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/external/synergy_agentic_ai_economy
        run: |
          python -m compileall -q external/synergy_agentic_ai_economy/agent_economy external/synergy_agentic_ai_economy/tests
          python -m py_compile external/synergy_agentic_ai_economy/experiments/closed_multimarket_hardnav_v4.py
          python -m pytest -q external/synergy_agentic_ai_economy/tests/test_multimarket_hardnav.py

  hardnav-v4-historical-replay:
    needs: cross-repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout pinned HardNAV V4 source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNERGY_CROSS_REPO_READ_TOKEN }}
          repository: Shtenco/synergy_agentic_ai_economy
          ref: 0effe839d160af295d511eaea6a3d3830e024557
          path: hardnav
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install historical replay dependencies
        run: python -m pip install --upgrade pip numpy pyarrow requests
      - name: Compile V4 replay
        working-directory: hardnav
        run: python -m py_compile experiments/closed_multimarket_hardnav_v4.py
      - name: Run full 13,000-block V4 historical replay
        working-directory: hardnav
        timeout-minutes: 105
        env:
          PYTHONPATH: ${{ github.workspace }}/hardnav
        run: python experiments/closed_multimarket_hardnav_v4.py
      - name: Validate generated V4 evidence
        working-directory: hardnav
        run: |
          python - <<'PY'
          import csv, json, pathlib
          report = pathlib.Path("reports/closed_multimarket_hardnav_v4/seed77_10000_train_3000_oos.json")
          manifest = pathlib.Path("data/real_backtest_v4/manifest.json")
          csv_path = pathlib.Path("data/real_backtest_v4/ethereum_23544921_23557920_exact_gas_real_prices.csv")
          assert report.is_file() and manifest.is_file() and csv_path.is_file()
          r = json.loads(report.read_text())
          assert r["ethereum_blocks"]["count"] == 13000
          assert r["ethereum_blocks"]["contiguous"] is True
          assert r["protocol"]["train_blocks"] == 10000
          assert r["protocol"]["oos_blocks"] == 3000
          assert r["protocol"]["hedge_anchor_selection"]["oos_used_for_selection"] is False
          assert r["protocol"]["weights_frozen_after_train"] is True
          assert r["market_inputs"]["factor_mapped_assets"] == []
          assert len(r["market_inputs"]["provenance"]) == 10
          assert set(r["gas_input"]["xatu_exact_fields"]) == {
              "block_date_time", "gas_used", "base_fee_per_gas"
          }
          assert set(r["gas_input"]["rpc_exact_fields"]) == {"gasLimit"}
          assert r["gas_input"]["rpc_provenance"]["method"] == "eth_getBlockByNumber"
          assert set(r["gas_input"]["rpc_provenance"]["cross_checked_fields"]) == {
              "timestamp", "gasUsed", "baseFeePerGas"
          }
          with csv_path.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 13000
          assert int(rows[0]["block_number"]) == 23544921
          assert int(rows[-1]["block_number"]) == 23557920
          print("V4 EVIDENCE GATES: PASS")
          PY
      - name: Upload V4 historical replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: hardnav-v4-historical-replay
          path: |
            hardnav/data/real_backtest_v4/
            hardnav/reports/closed_multimarket_hardnav_v4/
          if-no-files-found: error
          retention-days: 90
