name: Live AWS Object Lock and KMS disaster-recovery drill
on:
  workflow_dispatch:
    inputs:
      host_dr_run_id:
        description: Successful host outage workflow run containing the six-register backup artifact
        required: true
        type: string
      retention_days:
        description: Compliance-mode retention for immutable test objects and backup (minimum 30 days)
        required: true
        default: "30"
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: synergy-aws-live-dr
  cancel-in-progress: false
jobs:
  live-object-lock-drill:
    runs-on: ubuntu-latest
    environment: aws-live-dr
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the verified backup from the successful host outage run
        uses: actions/download-artifact@v4
        with:
          name: synergy-six-register-backup
          run-id: ${{ inputs.host_dr_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/synergy-dr
      - name: Install live AWS client
        run: python -m pip install "boto3>=1.35,<2" "cryptography>=44,<47"
      - name: Verify downloaded six-register backup before cloud upload
        run: python prototype/verify_six_register_backup.py "${{ runner.temp }}/synergy-dr/synergy-six-register-backup.tar.gz"
      - name: Obtain short-lived credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SYNERGY_AWS_DR_ROLE_ARN }}
          aws-region: ${{ secrets.SYNERGY_AWS_DR_REGION }}
          role-session-name: synergy-live-dr-${{ github.run_id }}
      - name: Verify independent account topology and run live S3 Object Lock/KMS drill
        env:
          AWS_REGION: ${{ secrets.SYNERGY_AWS_DR_REGION }}
          SYNERGY_DR_BUCKET: ${{ secrets.SYNERGY_AWS_DR_BUCKET }}
          SYNERGY_DR_BUCKET_OWNER_ACCOUNT: ${{ secrets.SYNERGY_AWS_DR_BUCKET_OWNER_ACCOUNT }}
          SYNERGY_DR_APP_ACCOUNT: ${{ secrets.SYNERGY_AWS_DR_APP_ACCOUNT }}
          SYNERGY_DR_KMS_KEY_ARN: ${{ secrets.SYNERGY_AWS_DR_KMS_KEY_ARN }}
          SYNERGY_DR_RETENTION_DAYS: ${{ inputs.retention_days }}
          SYNERGY_DR_BACKUP_FILE: ${{ runner.temp }}/synergy-dr/synergy-six-register-backup.tar.gz
        run: python research/infra/live_s3_object_lock_drill.py
